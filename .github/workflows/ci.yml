# Continuous integration: runs on every push to main and every pull request.
# It does not build a shippable app, it just proves the code is healthy:
# the frontend typechecks + builds, and the Rust crate is formatted, lint-clean,
# compiles, and passes any tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run if you push again to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build frontend
        run: bun run build

  rust:
    name: Rust (fmt + clippy + test)
    # Run on macOS because that is the primary target and it avoids the extra
    # Linux system libraries (webkit2gtk, etc.) that a Tauri build needs.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets
